[package]
name = "grimoire-launcher"
version = "1.6.0"
description = "Un launcher de juegos unificado con estética alquímica"
authors = ["Ángel"]
edition = "2021"

[lib]
name = "grimoire_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
keyvalues-parser = "0.2"        # Parseo de los .vdf / .acf de Steam
walkdir = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"                # Detectar cuándo muere el proceso del juego
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"                 # Leer rutas de Steam/Epic desde el registro
